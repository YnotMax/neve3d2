<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d9e8f5" />
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb852" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e8f0" />
      <stop offset="100%" stop-color="#90a4ae" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Planet aesthetic) -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#7ed6df" stroke-width="2"/>
  
  <!-- Planet Snow Dome -->
  <path d="M 6 42 Q 32 30 58 42 A 30 30 0 0 1 6 42 Z" fill="url(#snowGrad)" opacity="0.9" />

  <!-- Snow plow tractor body -->
  <rect x="20" y="27" width="20" height="13" rx="3" fill="url(#tractorGrad)" />
  <rect x="27" y="19" width="12" height="9" rx="2" fill="#2c3e50" />
  <rect x="29" y="20" width="8" height="6" rx="1" fill="#7ed6df" opacity="0.85" />

  <!-- Treads / Wheels -->
  <rect x="18" y="38" width="24" height="6" rx="3" fill="#1e272e" />
  <circle cx="23" cy="41" r="2" fill="#718093" />
  <circle cx="30" cy="41" r="2" fill="#718093" />
  <circle cx="37" cy="41" r="2" fill="#718093" />

  <!-- Plow Blade -->
  <path d="M 40 29 L 47 25 Q 50 35 46 44 L 39 40 Z" fill="url(#bladeGrad)" stroke="#576574" stroke-width="1" />

  <!-- Snow spray & stars -->
  <circle cx="51" cy="24" r="2.2" fill="#ffffff" />
  <circle cx="55" cy="30" r="1.6" fill="#ffffff" />
  <circle cx="49" cy="18" r="1.3" fill="#ffffff" />
  <polygon points="17,14 18.5,17.5 22,19 18.5,20.5 17,24 15.5,20.5 12,19 15.5,17.5" fill="#f5d487" opacity="0.9" />
  <polygon points="46,12 47,14.5 49.5,15.5 47,16.5 46,19 45,16.5 42.5,15.5 45,14.5" fill="#ffffff" opacity="0.8" />
</svg>
